# Single-origin host for Harmony. nginx serves the Angular bundle AND
# reverse-proxies the API + SignalR to the `api` container, so the browser only
# ever talks to ONE origin. That means: no CORS, the SameSite=Strict auth cookie
# just works, and the built bundle carries no hostname — so it runs unchanged
# behind localhost, a Cloudflare tunnel, or a real domain.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving `api` at request time (via a variable in
    # proxy_pass) means nginx starts even if the API container isn't up yet, and
    # survives the API being restarted by its healthcheck.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # gzip the text assets on the way out.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # REST API → api:8080 (full original path forwarded unchanged).
    location ^~ /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hubs → api:8080, with WebSocket upgrade + long-lived timeouts.
    location ^~ /hubs/ {
        set $hub_upstream http://api:8080;
        proxy_pass $hub_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build assets are immutable — cache them hard.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path renders the app shell (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients pin an old bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
