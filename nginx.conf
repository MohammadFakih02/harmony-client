# Static SPA host for the Harmony Angular bundle. Listens on 8080 (compose maps
# it to host 4200). All API/SignalR traffic goes straight from the browser to
# the API on http://localhost:5057 (baked into environment.ts), so nginx only
# serves files here — no reverse proxy.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the text assets on the way out.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable — cache them hard.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path renders the app shell (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients pin an old bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
