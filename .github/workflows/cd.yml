name: CD

# Continuous DELIVERY, not deployment: every commit that reaches `main` produces an
# immutable, deployable image in GHCR. Promoting one to the running environment is a
# deliberate `docker compose pull && up -d` on the server — see Harmony/AWS-HOSTING.md.
#
# `main` is protected (PR-only) and ci.yml runs the build + vitest suite on every pull
# request, so this workflow deliberately does NOT re-run them — it only packages the
# merge commit. A broken build still fails here, because `npm run build` runs inside
# the Docker build.
#
# NOTE the image is named harmony-WEB, not harmony-client: the container is the nginx
# front end (it also reverse-proxies /api and /hubs to the API), and the compose files
# refer to the service as `web`.

on:
  push:
    branches: [main]
  workflow_dispatch: # rebuild/repush on demand without a new commit

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets the built-in GITHUB_TOKEN push to GHCR — no PAT needed

    steps:
      - uses: actions/checkout@v5

      # GHCR rejects any tag whose repository path contains an uppercase letter, and
      # `github.repository_owner` preserves the account's original casing
      # (`MohammadFakih02`), so it must be lowercased here rather than used directly.
      - name: Compute image name and short SHA
        id: vars
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner_lc/harmony-web" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The production bundle carries NO hostname — nginx serves it and proxies /api and
      # /hubs same-origin — so this image is environment-independent and needs no build
      # args. The same artifact runs behind localhost, a tunnel, or the real domain.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo ""
            echo '```'
            echo "${{ steps.vars.outputs.image }}:latest"
            echo "${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.sha_short }}"
            echo '```'
            echo ""
            echo "Deploy on the server:"
            echo '```bash'
            echo "cd ~/harmony"
            echo "docker compose -f docker-compose.yml -f docker-compose.prod.yml pull"
            echo "docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
