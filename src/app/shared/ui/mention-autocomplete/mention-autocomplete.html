<div
  class="w-64 max-h-60 overflow-y-auto rounded-lg bg-surface-2 ring-1 ring-border-subtle shadow-modal py-1"
>
  @if (candidates().length === 0) {
  <p class="text-xs text-faint text-center py-3">No matches</p>
  } @else {
  @for (candidate of candidates(); track candidate.userId; let i = $index) {
  <button
    type="button"
    class="w-full flex items-center gap-2 px-3 py-1.5 text-left transition-micro"
    [class.bg-accent]="i === highlightedIndex()"
    [class.text-white]="i === highlightedIndex()"
    [class.hover:bg-surface-3]="i !== highlightedIndex()"
    (click)="select.emit(candidate)"
  >
    <ui-avatar [src]="candidate.avatarKey" [alt]="candidate.username" size="sm" />
    <span class="text-sm font-medium truncate">{{ candidate.username }}</span>
  </button>
  }
  }
</div>
