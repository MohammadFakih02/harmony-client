<ui-modal [heading]="heading()" size="md" (close)="close.emit()">
  <div class="px-6 pb-6 flex flex-col gap-4">
    @if (loadError()) {
      <p class="text-sm text-danger">Could not read this image. Try a different file.</p>
    } @else {
      <!-- Stage: the letterboxed source with the draggable fixed-aspect crop rect on top. -->
      <div #stage class="w-full flex justify-center select-none">
        @if (objectUrl(); as url) {
          <div
            class="relative overflow-hidden rounded-md bg-black/40 touch-none"
            [style.width.px]="displayW()"
            [style.height.px]="displayH()"
            (wheel)="onWheel($event)"
          >
            <img
              [src]="url"
              alt=""
              draggable="false"
              class="block w-full h-full pointer-events-none"
            />
            @if (rect(); as r) {
              <!-- The huge box-shadow dims everything OUTSIDE the selection. -->
              <div
                class="absolute cursor-move border-2 border-white/90 rounded-sm shadow-[0_0_0_9999px_rgba(0,0,0,0.6)]"
                [style.left.px]="r.x"
                [style.top.px]="r.y"
                [style.width.px]="r.w"
                [style.height.px]="r.h"
                (pointerdown)="onRectPointerDown($event)"
                (pointermove)="onRectPointerMove($event)"
                (pointerup)="onRectPointerUp()"
                (pointercancel)="onRectPointerUp()"
              ></div>
            }
          </div>
        }
      </div>

      <!-- Zoom slider (scales the selection about its centre; wheel does the same). -->
      <div class="flex items-center gap-3">
        <i class="fas fa-magnifying-glass-minus text-faint text-xs"></i>
        <input
          type="range"
          min="0"
          max="100"
          step="1"
          class="flex-1 accent-accent"
          aria-label="Zoom"
          [value]="zoomValue()"
          (input)="onZoomInput($event)"
        />
        <i class="fas fa-magnifying-glass-plus text-faint text-xs"></i>
      </div>

      <!-- Live preview, rendered exactly as the asset will appear. -->
      @if (previewStyle(); as style) {
        <div class="flex items-center gap-3">
          <span class="text-2xs font-bold uppercase tracking-wider text-faint">Preview</span>
          <div
            class="bg-no-repeat ring-1 ring-border-subtle bg-surface-3"
            [class.rounded-full]="aspect() === 1"
            [class.rounded-md]="aspect() !== 1"
            [style.width.px]="previewW()"
            [style.height.px]="previewH()"
            [style.background-image]="style['background-image']"
            [style.background-size]="style['background-size']"
            [style.background-position]="style['background-position']"
          ></div>
        </div>
      }

      <div class="flex justify-end gap-2 pt-1">
        <ui-button type="button" variant="ghost" (click)="close.emit()">Cancel</ui-button>
        <ui-button
          type="button"
          variant="primary"
          [loading]="exporting()"
          [disabled]="rect().w <= 0"
          (click)="confirm()"
        >
          Apply
        </ui-button>
      </div>
    }
  </div>
</ui-modal>
