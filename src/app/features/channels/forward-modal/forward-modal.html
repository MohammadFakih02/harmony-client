<ui-modal
  heading="Forward Message"
  subtitle="Pick where to send it."
  size="md"
  (close)="close.emit()"
>
    <!-- Search -->
    <div class="px-6 shrink-0">
      <div class="flex items-center gap-2 px-3 h-10 rounded-lg bg-surface-3 ring-1 ring-border-subtle">
        <i class="fas fa-magnifying-glass text-faint text-xs shrink-0"></i>
        <input
          type="text"
          class="flex-1 bg-transparent border-0 outline-none text-sm text-primary placeholder:text-faint"
          placeholder="Search channels or DMs"
          [ngModel]="query()"
          (ngModelChange)="query.set($event)"
        />
      </div>
    </div>

    <!-- Target list -->
    <div class="flex-1 overflow-y-auto px-6 py-3 min-h-0">
      @if (loading()) {
      <div class="flex items-center justify-center py-8">
        <i class="fas fa-yin-yang animate-spin text-xl text-faint"></i>
      </div>
      } @else if (groups().length === 0) {
      <p class="py-8 text-center text-sm text-faint">No channels found.</p>
      } @else {
      @for (group of groups(); track group.title) {
      <div class="mb-3">
        <p class="px-1 pb-1 text-2xs font-semibold uppercase tracking-wider text-muted">
          {{ group.title }}
        </p>
        @for (row of group.rows; track row.channelId) {
        <button
          type="button"
          class="w-full flex items-center gap-2.5 px-2 py-1.5 rounded-lg hover:bg-surface-2 transition-micro text-left"
          (click)="toggle(row.channelId)"
        >
          @if (row.isDm) {
          <ui-avatar [src]="row.avatarKey" [alt]="row.label" size="sm" class="shrink-0" />
          } @else {
          <span class="w-6 h-6 flex items-center justify-center text-faint shrink-0">
            <i class="fas fa-hashtag text-sm"></i>
          </span>
          }
          <span class="flex-1 min-w-0 truncate text-sm text-primary">{{ row.label }}</span>
          <span
            class="w-5 h-5 flex items-center justify-center rounded-md ring-1 shrink-0 transition-micro"
            [class.bg-accent]="isSelected(row.channelId)"
            [class.ring-accent]="isSelected(row.channelId)"
            [class.ring-border-subtle]="!isSelected(row.channelId)"
          >
            @if (isSelected(row.channelId)) {
            <i class="fas fa-check text-2xs text-white"></i>
            }
          </span>
        </button>
        }
      </div>
      }
      }
    </div>

    <!-- Optional note + actions -->
    <div class="flex flex-col gap-3 p-6 pt-3 border-t border-border-subtle shrink-0">
      @if (error()) {
      <div class="flex items-center gap-2 text-xs text-danger">
        <i class="fas fa-circle-exclamation shrink-0"></i>
        <span>{{ error() }}</span>
      </div>
      }
      <input
        type="text"
        class="w-full px-3 py-2 rounded-lg bg-surface-3 ring-1 ring-border-subtle text-sm text-primary placeholder:text-faint outline-none focus:ring-2 focus:ring-accent transition-micro"
        placeholder="Add a message (optional)"
        [ngModel]="note()"
        (ngModelChange)="note.set($event)"
        (keydown.enter)="send()"
      />
      <div class="flex items-center justify-end gap-2">
        <button
          type="button"
          class="px-4 py-2 rounded-lg text-sm font-medium text-muted hover:text-primary transition-micro"
          (click)="close.emit()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-micro"
          [class.bg-accent]="canSend()"
          [class.text-white]="canSend()"
          [class.hover:bg-accent-hover]="canSend()"
          [class.bg-surface-3]="!canSend()"
          [class.text-faint]="!canSend()"
          [class.cursor-not-allowed]="!canSend()"
          [disabled]="!canSend()"
          (click)="send()"
        >
          @if (sending()) {
          <i class="fas fa-yin-yang animate-spin"></i>
          }
          <span>{{ selected().size > 1 ? 'Forward (' + selected().size + ')' : 'Forward' }}</span>
        </button>
      </div>
    </div>
</ui-modal>
