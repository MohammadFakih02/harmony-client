<!-- Added: w-full, mx-auto, shrink-0, and a matching max-width (e.g., max-w-5xl) -->
<div class="w-full mx-auto flex items-end gap-2 px-4 py-3 shrink-0">
  <div
    class="flex-1 flex items-center bg-surface-3 rounded-xl min-h-11 ring-1 ring-border-subtle focus-within:ring-2 focus-within:ring-accent transition-micro"
  >
    <textarea
      autoGrow
      [maxHeight]="200"
      [autoGrowValue]="draft()"
      class="flex-1 bg-transparent border-0 outline-none focus:outline-none focus-visible:outline-none text-sm px-4 py-2.5 text-primary placeholder:text-faint resize-none leading-normal overflow-y-auto self-center"
      [placeholder]="'Message #' + channelName()"
      [ngModel]="draft()"
      (ngModelChange)="draft.set($event)"
      (keydown)="onKeydown($event)"
      rows="1"
    ></textarea>
  </div>
  <button
    class="flex items-center justify-center w-11 h-11 rounded-xl shrink-0 transition-micro text-sm font-medium"
    [class.bg-accent]="canSend()"
    [class.text-white]="canSend()"
    [class.hover:bg-accent-hover]="canSend()"
    [class.bg-surface-3]="!canSend()"
    [class.text-faint]="!canSend()"
    [class.cursor-not-allowed]="!canSend()"
    [disabled]="!canSend() || sending()"
    (click)="send()"
    title="Send message"
  >
    @if (sending()) {
    <i class="fas fa-yin-yang animate-spin"></i>
    } @else {
    <i class="fas fa-paper-plane"></i>
    }
  </button>
</div>
