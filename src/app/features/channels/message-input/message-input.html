<div class="flex items-end gap-2 px-4 py-3">
  <div
    class="flex-1 bg-surface-2 rounded-lg border border-border-subtle px-4 py-2.5 focus-within:border-accent transition-micro"
  >
    <textarea
      class="w-full bg-transparent text-sm text-primary placeholder-faint resize-none focus:outline-none leading-relaxed max-h-48 overflow-y-auto"
      [placeholder]="'Message #' + channelName()"
      [ngModel]="draft()"
      (ngModelChange)="draft.set($event)"
      (keydown)="onKeydown($event)"
      rows="1"
    ></textarea>
  </div>
  <ui-button
    variant="primary"
    size="icon"
    [loading]="sending()"
    [disabled]="!canSend()"
    (click)="send()"
    title="Send message"
  >
    <i class="fas fa-paper-plane text-sm"></i>
  </ui-button>
</div>
