<div class="flex h-screen w-screen bg-bg overflow-hidden select-none">
  <!-- Guild Navigation Bar -->
  <div class="flex flex-col h-full w-18 min-w-18 bg-surface overflow-hidden">
    <app-guild-sidebar />
  </div>

  <!-- Channel Navigation Panel -->
  <div class="flex flex-col h-full w-60 min-w-60 bg-surface-2 overflow-hidden border-r border-border-subtle">
    <app-channel-sidebar />
  </div>

  <!-- Content Workspace -->
  <main class="flex-1 h-full bg-surface overflow-hidden flex min-w-0">
    <div class="flex-1 flex flex-col overflow-hidden min-w-0 relative">
      <!-- Notification bell (always) + member list toggle (guild channels only), top-right of chat -->
      <div class="absolute top-2 right-3 z-10 flex items-center gap-1">
        <app-notification-bell />
        @if (inGuild()) {
        <ui-icon-button
          size="md"
          [active]="showMembers()"
          label="Toggle Member List"
          (click)="showMembers.set(!showMembers())"
        >
          <i class="fas fa-users"></i>
        </ui-icon-button>
        }
      </div>
      <router-outlet />
    </div>

    <!-- Member sidebar (togglable) — guild channels only -->
    @if (inGuild() && showMembers()) {
    <div class="w-60 min-w-60 h-full bg-surface-2 border-l border-border-subtle overflow-hidden shrink-0">
      <app-member-sidebar />
    </div>
    }
  </main>
</div>

<!-- App-wide image lightbox -->
<ui-lightbox />

<!-- Connection status banner -->
@if (signalR.connectionState() === 'reconnecting' || signalR.connectionState() === 'disconnected') {
<div
  class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium shadow-modal animate-slide-up"
  [class.bg-warning]="signalR.connectionState() === 'reconnecting'"
  [class.text-bg]="signalR.connectionState() === 'reconnecting'"
  [class.bg-danger]="signalR.connectionState() === 'disconnected'"
  [class.text-white]="signalR.connectionState() === 'disconnected'"
>
  @if (signalR.connectionState() === 'reconnecting') {
    <i class="fas fa-yin-yang animate-spin text-xs"></i>
    <span>Reconnecting…</span>
  } @else {
    <i class="fas fa-wifi text-xs"></i>
    <span>Connection lost —</span>
    <button class="underline hover:no-underline font-semibold" onclick="location.reload()">
      refresh to reconnect
    </button>
  }
</div>
}
