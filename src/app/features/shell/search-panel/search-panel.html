<!-- Search input -->
<div class="flex items-center gap-2 px-3 h-11 border-b border-border-subtle shrink-0">
  <i class="fas fa-magnifying-glass text-faint text-sm"></i>
  <input
    #searchInput
    type="text"
    class="flex-1 bg-transparent text-sm text-primary placeholder:text-faint outline-none"
    placeholder="Search this server"
    [value]="query()"
    (input)="onInput($any($event.target).value)"
  />
  @if (loading()) {
  <i class="fas fa-yin-yang animate-spin text-faint text-sm"></i>
  }
  <button type="button" class="text-faint hover:text-primary" (click)="close.emit()">
    <i class="fas fa-xmark"></i>
  </button>
</div>

<!-- Results -->
<div class="flex-1 min-h-0 overflow-y-auto">
  @if (results().length > 0) {
  @for (r of results(); track r.messageId) {
  <button
    type="button"
    class="w-full text-left px-3 py-2 flex flex-col gap-1 hover:bg-surface-3 transition-micro border-b border-border-subtle/50"
    (click)="selectResult(r)"
  >
    <div class="flex items-center gap-2 text-xs">
      <ui-avatar [src]="r.avatarKey" [alt]="r.username" size="sm" />
      <span class="font-semibold text-primary truncate">{{ r.username }}</span>
      <span class="text-faint shrink-0">in</span>
      <span class="text-muted truncate">#{{ r.channelName }}</span>
      <span class="flex-1"></span>
      <span class="text-faint shrink-0">{{ formatTime(r.createdAt) }}</span>
    </div>
    <p class="text-sm text-secondary line-clamp-2 wrap-break-word">
      @for (seg of highlight(r.content); track $index) {
      @if (seg.match) { <span class="font-semibold text-primary">{{ seg.text }}</span> }
      @else { <span>{{ seg.text }}</span> }
      }
    </p>
  </button>
  }
  @if (hasMore()) {
  <button
    type="button"
    class="w-full py-2 text-xs font-medium text-accent hover:bg-surface-3 transition-micro"
    (click)="loadMore()"
  >
    Load more
  </button>
  }
  } @else if (loading()) {
  <div class="flex items-center justify-center py-10">
    <i class="fas fa-yin-yang animate-spin text-faint text-xl"></i>
  </div>
  } @else if (searched()) {
  <div class="flex flex-col items-center justify-center py-10 gap-2 text-center px-4">
    <i class="fas fa-magnifying-glass text-3xl text-faint"></i>
    <p class="text-sm text-muted">No messages found.</p>
  </div>
  } @else {
  <div class="flex flex-col items-center justify-center py-10 gap-2 text-center px-4">
    <i class="fas fa-magnifying-glass text-3xl text-faint"></i>
    <p class="text-sm text-muted">Search for messages in this server.</p>
  </div>
  }
</div>
