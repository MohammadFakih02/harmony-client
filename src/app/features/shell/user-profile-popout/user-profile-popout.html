<div class="w-72 max-w-[calc(100vw-1rem)] rounded-xl bg-surface shadow-modal border border-border overflow-hidden animate-slide-up">
  <!-- Banner: image > picked colour > top-role (or accent) gradient -->
  <ui-profile-banner
    class="h-20"
    [bannerKey]="profile()?.bannerKey ?? null"
    [bannerColor]="profile()?.bannerColor ?? null"
    [fallback]="bannerStyle()"
    [alt]="displayName()"
  />

  <div class="px-4">
    <!-- Avatar overlapping the banner + owner badge (relative z-10 keeps it above the banner) -->
    <div class="relative z-10 flex items-end justify-between -mt-10">
      <div class="inline-block rounded-full p-1.25 bg-surface">
        <ui-avatar
          [src]="avatarKey()"
          [alt]="displayName()"
          size="2xl"
          [status]="avatarStatus()"
          ringClass="border-surface"
        />
      </div>
      @if (isOwner()) {
      <span
        class="mb-1.5 inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-warning-muted text-warning text-2xs font-semibold shrink-0"
        title="Server owner"
      >
        <i class="fas fa-crown"></i> Owner
      </span>
      }
    </div>

    <!-- Identity -->
    <div class="mt-2.5 min-w-0">
      <p class="text-lg font-bold text-primary leading-tight truncate">{{ displayName() }}</p>
      @if (hasNickname()) {
      <p class="text-xs text-muted truncate mt-0.5">{{ username() }}</p>
      }
    </div>

    <!-- Custom status -->
    @if (statusMessage(); as msg) {
    <div class="mt-2 rounded-lg bg-surface-2 border border-border-subtle px-2.5 py-1.5 flex items-start gap-1.5">
      <i class="fas fa-quote-left text-2xs text-faint mt-1 shrink-0"></i>
      <span class="text-xs text-muted whitespace-pre-wrap wrap-break-word min-w-0">{{ msg }}</span>
    </div>
    }

    <!-- Roles (About Me + Member Since live in the full profile) -->
    @if (roleChips().length) {
    <div class="my-3 h-px bg-border-subtle"></div>
    <div class="mb-3">
      <p class="text-2xs font-bold uppercase tracking-wider text-faint mb-1.5">Roles</p>
      <div class="flex flex-wrap gap-1">
        @for (role of roleChips(); track role.id) {
        <span
          class="inline-flex items-center gap-1.5 pl-1.5 pr-2 py-0.5 rounded-md bg-surface-2 border border-border-subtle text-xs font-medium text-primary"
        >
          <span
            class="w-2.5 h-2.5 rounded-full shrink-0"
            [style.background-color]="role.color ?? 'var(--color-text-faint)'"
          ></span>
          {{ role.name }}
        </span>
        }
      </div>
    </div>
    }
  </div>

  <!-- Actions -->
  <div class="p-4 pt-3.5 flex flex-col gap-1.5">
    @if (!isSelf()) {
    <button
      type="button"
      class="w-full h-9 rounded-lg text-sm font-semibold bg-accent text-white hover:bg-accent-hover transition-micro flex items-center justify-center gap-2"
      (click)="message()"
    >
      <i class="fas fa-message text-xs"></i> Message
    </button>
    }
    @if (canAddFriend()) {
    <button
      type="button"
      class="w-full h-8 rounded-lg text-xs font-medium text-muted hover:text-primary bg-surface-2 hover:bg-surface-3 transition-micro flex items-center justify-center gap-2 disabled:opacity-60"
      [disabled]="sendingFriendRequest()"
      (click)="addFriend()"
    >
      <i class="fas fa-user-plus text-2xs"></i> Add Friend
    </button>
    }
    <button
      type="button"
      class="w-full h-8 rounded-lg text-xs font-medium text-muted hover:text-primary bg-surface-2 hover:bg-surface-3 transition-micro"
      (click)="viewFullProfile()"
    >
      View Full Profile
    </button>
  </div>
</div>
