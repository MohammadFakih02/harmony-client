<div class="min-h-dvh zen-mesh-bg flex items-center justify-center px-4">
  <div
    class="w-full max-w-md bg-surface rounded-3xl shadow-modal p-8 border border-border animate-scale-in"
  >
    <div class="text-center mb-8">
      <div
        class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-accent-muted mb-4 animate-pulse-glow"
      >
        <i class="fas fa-yin-yang text-6xl text-accent-light"></i>
      </div>
      <h1 class="text-2xl font-bold text-primary">Forgot your password?</h1>
      <p class="text-muted text-sm mt-1">We'll email you a link to reset it.</p>
    </div>

    @if (!sent()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-4">
      <ui-input
        formControlName="email"
        label="Email"
        inputType="email"
        placeholder="you@example.com"
        autocomplete="email"
        inputId="email"
        [error]="emailError"
      />
      <div class="pt-2">
        <ui-button type="submit" variant="primary" [block]="true" [loading]="loading()">
          {{ loading() ? 'Sending...' : 'Send reset link' }}
        </ui-button>
      </div>
    </form>
    } @else {
    <div
      class="mb-2 px-4 py-3 rounded-lg bg-accent-muted border border-border text-primary text-sm text-center animate-slide-up"
    >
      If an account exists for that email, we've sent a link to reset your password.
    </div>
    }

    <p class="text-center text-sm text-muted mt-6">
      <a routerLink="/login" class="text-accent-light hover:text-accent font-medium transition-colors">
        Back to sign in
      </a>
    </p>
  </div>
</div>
