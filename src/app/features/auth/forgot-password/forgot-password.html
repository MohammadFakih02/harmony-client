<app-auth-shell>
  <div class="mb-7">
    <h1 class="font-display text-[1.75rem] font-bold tracking-[-0.02em] text-primary">Forgot your password?</h1>
    <p class="text-muted text-sm mt-1.5">We'll email you a link to reset it.</p>
  </div>

  @if (!sent()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-4">
      <ui-input
        formControlName="email"
        label="Email"
        inputType="email"
        placeholder="you@example.com"
        autocomplete="email"
        inputId="email"
        [error]="emailError"
      />
      <div class="pt-2">
        <ui-button type="submit" variant="primary" [block]="true" [loading]="loading()">
          {{ loading() ? 'Sending…' : 'Send reset link' }}
        </ui-button>
      </div>
    </form>
  } @else {
    <div
      class="px-4 py-3 rounded-lg bg-accent-muted border border-border text-primary text-sm text-center animate-slide-up"
    >
      If an account exists for that email, we've sent a link to reset your password.
    </div>
  }

  <p class="text-center text-sm text-muted mt-6">
    <a routerLink="/login" class="text-accent-light hover:text-accent font-medium transition-colors">
      Back to sign in
    </a>
  </p>
</app-auth-shell>
