<app-auth-shell>
  <div class="mb-7">
    <h1 class="font-display text-[1.75rem] font-bold tracking-[-0.02em] text-primary">Create your account</h1>
    <p class="text-muted text-sm mt-1.5">Join Harmony and find your people.</p>
  </div>

  <!-- Error banner -->
  @if (error()) {
    <div
      class="mb-5 px-4 py-3 rounded-lg bg-danger-muted border border-danger text-danger text-sm animate-slide-up"
    >
      {{ error() }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-4">
    <ui-input
      formControlName="username"
      label="Username"
      placeholder="cooluser"
      autocomplete="username"
      inputId="username"
      [error]="usernameError"
    />
    <ui-input
      formControlName="email"
      label="Email"
      inputType="email"
      placeholder="you@example.com"
      autocomplete="email"
      inputId="email"
      [error]="emailError"
    />
    <ui-input
      formControlName="password"
      label="Password"
      inputType="password"
      placeholder="••••••••"
      autocomplete="new-password"
      inputId="password"
      [error]="passwordError"
    />
    <ui-input
      formControlName="confirmPassword"
      label="Confirm Password"
      inputType="password"
      placeholder="••••••••"
      autocomplete="new-password"
      inputId="confirmPassword"
      [error]="confirmPasswordError"
    />
    <div class="pt-2">
      <ui-button type="submit" variant="primary" [block]="true" [loading]="loading()">
        {{ loading() ? 'Creating account…' : 'Create account' }}
      </ui-button>
    </div>
  </form>

  <div class="flex items-center gap-3 my-6">
    <div class="flex-1 h-px bg-border"></div>
    <span class="text-xs text-muted">OR</span>
    <div class="flex-1 h-px bg-border"></div>
  </div>

  <app-google-sign-in-button (credential)="onGoogleCredential($event)" />

  <p class="text-center text-sm text-muted mt-6">
    Already have an account?
    <a routerLink="/login" class="text-accent-light hover:text-accent font-medium transition-colors">
      Sign in
    </a>
  </p>
</app-auth-shell>
