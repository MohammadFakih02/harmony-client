<div class="min-h-screen zen-mesh-bg flex items-center justify-center px-4">
  <div
    class="w-full max-w-md bg-surface rounded-3xl shadow-modal p-8 border border-border animate-scale-in"
  >
    <!-- Brand -->
    <div class="text-center mb-8">
      <div
        class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-accent-muted mb-4 animate-pulse-glow"
      >
        <i class="fas fa-yin-yang text-6xl text-accent-light"></i>
      </div>
      <h1 class="text-2xl font-bold text-primary">Create an account</h1>
      <p class="text-muted text-sm mt-1">Join Harmony today</p>
    </div>

    <!-- Error banner -->
    @if (error()) {
      <div
        class="mb-5 px-4 py-3 rounded-lg bg-danger-muted border border-danger text-danger text-sm animate-slide-up"
      >
        {{ error() }}
      </div>
    }

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-4">
      <ui-input
        formControlName="username"
        label="Username"
        placeholder="cooluser"
        autocomplete="username"
        inputId="username"
        [error]="usernameError"
      />
      <ui-input
        formControlName="email"
        label="Email"
        inputType="email"
        placeholder="you@example.com"
        autocomplete="email"
        inputId="email"
        [error]="emailError"
      />
      <ui-input
        formControlName="password"
        label="Password"
        inputType="password"
        placeholder="••••••••"
        autocomplete="new-password"
        inputId="password"
        [error]="passwordError"
      />
      <ui-input
        formControlName="confirmPassword"
        label="Confirm Password"
        inputType="password"
        placeholder="••••••••"
        autocomplete="new-password"
        inputId="confirmPassword"
        [error]="confirmPasswordError"
      />
      <div class="pt-2">
        <ui-button type="submit" variant="primary" [block]="true" [loading]="loading()">
          {{ loading() ? 'Creating account...' : 'Create account' }}
        </ui-button>
      </div>
    </form>

    <!-- Footer -->
    <p class="text-center text-sm text-muted mt-6">
      Already have an account?
      <a
        routerLink="/login"
        class="text-accent-light hover:text-accent font-medium transition-colors"
      >
        Sign in
      </a>
    </p>
  </div>
</div>
