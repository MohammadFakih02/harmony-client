<app-auth-shell>
  @if (state() === 'verifying') {
    <div class="flex flex-col items-center gap-4 text-center py-6">
      <i class="spinner-brand text-2xl text-accent-light"></i>
      <p class="text-sm text-muted">Verifying your email…</p>
    </div>
  } @else if (state() === 'success') {
    <div class="flex flex-col items-center gap-5 text-center">
      <div
        class="w-16 h-16 rounded-3xl bg-success/15 flex items-center justify-center text-success text-2xl"
      >
        <i class="fas fa-check"></i>
      </div>
      <h2 class="text-lg font-bold text-primary">Email verified</h2>
      <p class="text-sm text-muted">Your email address has been confirmed.</p>
      <ui-button type="button" variant="primary" [block]="true" (click)="continue()">
        Continue to Harmony
      </ui-button>
    </div>
  } @else {
    <div class="flex flex-col items-center gap-5 text-center">
      <div
        class="w-16 h-16 rounded-3xl bg-danger/15 flex items-center justify-center text-danger text-2xl"
      >
        <i class="fas fa-triangle-exclamation"></i>
      </div>
      <h2 class="text-lg font-bold text-primary">Verification failed</h2>
      <p class="text-sm text-muted">{{ error() || 'This link may have expired or already been used.' }}</p>
      <ui-button type="button" variant="primary" [block]="true" (click)="continue()">
        Go to Harmony
      </ui-button>
    </div>
  }
</app-auth-shell>
