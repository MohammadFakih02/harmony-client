<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HarmonyClient</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Harmony — a real-time communication platform with servers, channels, direct messages, and voice.">
  <!-- Matches the page background; updated to the active theme's bg by the pre-paint script below. -->
  <meta name="theme-color" content="#0b0a10">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Inter font: preconnect + direct <link> so the font CSS is discovered
       immediately, instead of serially behind styles.css (was an @import there). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@500;600;700&display=swap">

  <!-- Google Identity Services — powers the "Sign in with Google" button (GoogleSignInButton).
       ?hl=en pins the library's language; without it GIS renders the button in the
       browser/OS locale (and can ignore renderButton's `locale` option). -->
  <script src="https://accounts.google.com/gsi/client?hl=en" async defer></script>

  <!-- Apply the saved theme + background BEFORE first paint, so there's no
       white flash and no wrong-theme flash while Angular boots. -->
  <script>
    (function () {
      try {
        // Stored as "{palette}:{mode}". Legacy single-axis values are mapped;
        // the bg hexes duplicate styles.css --color-bg (must run before CSS loads).
        var raw = localStorage.getItem('harmony-theme') || 'violet:dark';
        var legacy = {
          'theme-dark': 'violet:dark',
          'theme-light': 'violet:light',
          'theme-midnight': 'midnight:dark',
          'theme-forest': 'forest:dark'
        };
        raw = legacy[raw] || raw;
        var bgs = {
          'violet:dark': '#0b0a10',
          'violet:light': '#e7e5f0',
          'midnight:dark': '#000000',
          'midnight:light': '#e2e4e9',
          'forest:dark': '#0a0e0b',
          'forest:light': '#e2eae4'
        };
        if (!bgs[raw]) raw = 'violet:dark';
        var parts = raw.split(':');
        document.documentElement.classList.add('palette-' + parts[0], 'mode-' + parts[1]);
        document.documentElement.style.backgroundColor = bgs[raw];
        document.documentElement.style.colorScheme = parts[1] === 'light' ? 'light' : 'dark';
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', bgs[raw]);
      } catch (e) { /* localStorage blocked → fall back to CSS default */ }
    })();
  </script>

  <!-- Boot splash. Two stacked layers inside #app-splash:
         • #app-skeleton — an app-shell skeleton with a left→right glow sweep (the default).
         • #app-spinner  — brand + spinner, revealed only if boot exceeds the threshold.
       CSS-var fallbacks cover the moment before styles.css loads; once it does the
       values resolve per active theme. -->
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: var(--color-bg, #0b0a10);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    #app-splash > * { position: absolute; inset: 0; }

    /* ---------- Skeleton (default boot state) ---------- */
    #app-skeleton {
      display: flex;
      overflow: hidden;
      --sk-block: var(--color-surface-3, #2c2938);
      --sk-glow: rgba(255, 255, 255, 0.06);
      transition: opacity 0.3s ease;
    }
    html.mode-light #app-skeleton { --sk-glow: rgba(0, 0, 0, 0.045); }
    #app-skeleton .sk { background: var(--sk-block); border-radius: 6px; }
    #app-skeleton .sk-circle { border-radius: 50%; }

    /* Guild rail */
    #app-skeleton .sk-rail {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      width: 72px; padding: 14px 0; flex-shrink: 0;
      background: var(--color-bg, #0b0a10);
    }
    #app-skeleton .sk-rail .sk { width: 44px; height: 44px; }
    #app-skeleton .sk-rail .sk-pill { border-radius: 14px; }

    /* Channel sidebar */
    #app-skeleton .sk-side {
      display: flex; flex-direction: column; width: 240px; flex-shrink: 0;
      background: var(--color-surface-2, #17151f);
    }
    #app-skeleton .sk-head {
      height: 50px; display: flex; align-items: center; padding: 0 16px;
      border-bottom: 1px solid var(--color-border-subtle, #221f2e);
    }
    #app-skeleton .sk-head .sk { width: 55%; height: 14px; }
    #app-skeleton .sk-list { flex: 1; padding: 16px 10px; display: flex; flex-direction: column; gap: 12px; }
    #app-skeleton .sk-list .sk { height: 14px; }
    #app-skeleton .sk-deck {
      height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
      border-top: 1px solid var(--color-border-subtle, #221f2e);
    }
    #app-skeleton .sk-deck .sk-circle { width: 34px; height: 34px; flex-shrink: 0; }

    /* Main column */
    #app-skeleton .sk-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #app-skeleton .sk-top {
      height: 50px; display: flex; align-items: center; padding: 0 18px;
      border-bottom: 1px solid var(--color-border-subtle, #221f2e);
    }
    #app-skeleton .sk-top .sk { width: 180px; height: 14px; }
    #app-skeleton .sk-msgs { flex: 1; padding: 24px 18px; display: flex; flex-direction: column; gap: 22px; }
    #app-skeleton .sk-msg { display: flex; gap: 14px; }
    #app-skeleton .sk-msg .sk-av { width: 40px; height: 40px; flex-shrink: 0; }
    #app-skeleton .sk-msg .sk-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    #app-skeleton .sk-msg .sk-lines .sk { height: 12px; }
    #app-skeleton .sk-composer { height: 44px; margin: 0 18px 22px; }

    /* The glow — one band travelling left→right across the whole skeleton. */
    #app-skeleton .sk-sweep {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(100deg, transparent 35%, var(--sk-glow) 50%, transparent 65%);
      transform: translateX(-100%);
      animation: sk-sweep 1.6s ease-in-out infinite;
    }
    @keyframes sk-sweep { to { transform: translateX(100%); } }

    @media (max-width: 767px) {
      #app-skeleton .sk-rail, #app-skeleton .sk-side { display: none; }
    }

    /* ---------- Spinner (slow-boot fallback) ---------- */
    #app-spinner {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.25rem; color: var(--color-text, #f4f3f7);
      opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
    }
    #app-splash.show-spinner #app-spinner { opacity: 1; pointer-events: auto; }
    #app-splash.show-spinner #app-skeleton { opacity: 0; }
    #app-spinner .app-splash-brand {
      display: flex; align-items: center; gap: 0.5rem;
      font-family: 'Sora', 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em;
    }
    #app-spinner .app-splash-brand .mark { display: inline-flex; line-height: 0; }
    #app-spinner .app-splash-spinner {
      width: 42px; height: 42px; border-radius: 50%;
      border: 3px solid var(--color-surface-3, #2c2938);
      border-top-color: var(--color-accent, #8b5cf6);
      animation: app-splash-spin 0.8s linear infinite;
    }
    #app-spinner .app-splash-msg {
      font-size: 0.875rem; color: var(--color-muted, #a1a1aa);
      min-height: 1.25rem; transition: opacity 0.25s ease;
    }
    @keyframes app-splash-spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      #app-skeleton .sk-sweep { animation: none; opacity: 0.5; }
      #app-spinner .app-splash-spinner { animation: none; }
    }
  </style>
</head>
<body>
  <app-root>
    <!-- Shown until Angular bootstraps and replaces <app-root>'s contents. -->
    <div id="app-splash">
      <!-- Default: an app-shell skeleton with a left→right glow sweep. -->
      <div id="app-skeleton" aria-hidden="true">
        <div class="sk-rail">
          <div class="sk sk-pill"></div>
          <div class="sk sk-circle"></div>
          <div class="sk sk-circle"></div>
          <div class="sk sk-circle"></div>
          <div class="sk sk-circle"></div>
        </div>
        <div class="sk-side">
          <div class="sk-head"><div class="sk"></div></div>
          <div class="sk-list">
            <div class="sk" style="width:45%"></div>
            <div class="sk" style="width:72%"></div>
            <div class="sk" style="width:58%"></div>
            <div class="sk" style="width:80%"></div>
            <div class="sk" style="width:40%"></div>
            <div class="sk" style="width:66%"></div>
            <div class="sk" style="width:52%"></div>
          </div>
          <div class="sk-deck">
            <div class="sk sk-circle"></div>
            <div style="flex:1">
              <div class="sk" style="width:60%;height:10px;margin-bottom:6px"></div>
              <div class="sk" style="width:40%;height:8px"></div>
            </div>
          </div>
        </div>
        <div class="sk-main">
          <div class="sk-top"><div class="sk"></div></div>
          <div class="sk-msgs">
            <div class="sk-msg"><div class="sk sk-circle sk-av"></div><div class="sk-lines"><div class="sk" style="width:140px"></div><div class="sk" style="width:75%"></div></div></div>
            <div class="sk-msg"><div class="sk sk-circle sk-av"></div><div class="sk-lines"><div class="sk" style="width:110px"></div><div class="sk" style="width:55%"></div><div class="sk" style="width:40%"></div></div></div>
            <div class="sk-msg"><div class="sk sk-circle sk-av"></div><div class="sk-lines"><div class="sk" style="width:160px"></div><div class="sk" style="width:85%"></div></div></div>
            <div class="sk-msg"><div class="sk sk-circle sk-av"></div><div class="sk-lines"><div class="sk" style="width:120px"></div><div class="sk" style="width:48%"></div></div></div>
            <div class="sk-msg"><div class="sk sk-circle sk-av"></div><div class="sk-lines"><div class="sk" style="width:135px"></div><div class="sk" style="width:68%"></div><div class="sk" style="width:35%"></div></div></div>
          </div>
          <div class="sk sk-composer"></div>
        </div>
        <div class="sk-sweep"></div>
      </div>

      <!-- Slow-boot fallback: brand + spinner (cross-fades in past the threshold). -->
      <div id="app-spinner">
        <div class="app-splash-brand">
          <span class="mark">
            <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="12.5" cy="16" r="7.4" stroke="var(--color-accent, #8b5cf6)" stroke-width="2.3" opacity="0.85"/>
              <circle cx="19.5" cy="16" r="7.4" stroke="var(--color-accent, #8b5cf6)" stroke-width="2.3" opacity="0.85"/>
              <path d="M16 9.48 A7.4 7.4 0 0 1 16 22.52 A7.4 7.4 0 0 1 16 9.48 Z" fill="var(--color-accent-light, #a78bfa)"/>
            </svg>
          </span>
          Harmony
        </div>
        <div class="app-splash-spinner"></div>
        <div class="app-splash-msg" id="app-splash-msg">Starting up…</div>
      </div>
    </div>
  </app-root>

  <script>
    (function () {
      var splash = document.getElementById('app-splash');
      if (!splash) return;
      var THRESHOLD = 1100; // skeleton first; escalate to the spinner only on a slow boot

      function startMessages() {
        var el = document.getElementById('app-splash-msg');
        if (!el) return;
        var msgs = [
          'Connecting to the server…',
          'Establishing the realtime link…',
          'Loading your guilds…',
          'Syncing messages…',
          'Almost ready…'
        ];
        var i = 0;
        var id = setInterval(function () {
          // Angular replaced <app-root> → splash gone → stop the timer.
          if (!document.getElementById('app-splash-msg')) { clearInterval(id); return; }
          i = (i + 1) % msgs.length;
          el.style.opacity = '0';
          setTimeout(function () {
            if (!el.isConnected) return;
            el.textContent = msgs[i];
            el.style.opacity = '1';
          }, 250);
        }, 1600);
      }

      setTimeout(function () {
        // Angular replaces <app-root>'s contents on bootstrap → the splash is gone by now
        // on a fast boot, so there's nothing to escalate.
        if (!document.body.contains(splash)) return;
        splash.classList.add('show-spinner');
        startMessages();
      }, THRESHOLD);
    })();
  </script>
</body>
</html>
